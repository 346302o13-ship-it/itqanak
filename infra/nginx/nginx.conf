worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format json escape=json
    '{"timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"client_addr":"$http_x_real_ip",'
    '"request_id":"$request_id",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time"}';
  access_log /dev/stdout json;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  server_tokens off;
  # Ordinary forms are small URL-encoded state changes. Attachment uploads get
  # their own streaming location and independently enforced 25 MiB envelope.
  client_max_body_size 256k;
  client_body_timeout 15s;
  client_header_timeout 15s;
  reset_timedout_connection on;

  # Docker's embedded resolver permits recovery when the web container is
  # replaced. The variable form makes proxy_pass resolve at request time.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Caddy terminates TLS before this loopback-only gateway. Preserve its
  # original scheme for absolute URLs and secure origin checks, while keeping a
  # sane fallback for direct local health probes.
  map $http_x_forwarded_proto $original_scheme {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Verification and reset links keep their one-time token in a URL fragment,
    # which browsers never send in either access or error-log request lines.
    # `same-origin` also preserves the Origin semantics needed by central CSRF.
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

    location = /_gateway/health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Raw private uploads: legacy request files plus the canonical student/admin
    # conversation attachment endpoints. Keep this allowlist exact so ordinary
    # API routes retain the much smaller form-body limit.
    location ~ ^/api/(?:student/requests/[^/]+/attachments|student/conversation/attachments|admin/conversations/[^/]+/attachments)$ {
      client_max_body_size 25m;
      set $upstream http://web:3000;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      # This gateway is loopback-only behind Caddy. Caddy removes untrusted
      # incoming forwarding headers and writes X-Real-IP from its direct peer,
      # so forwarding that single value preserves per-client rate limiting.
      proxy_set_header X-Real-IP $http_x_real_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $original_scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      # Stream the sole raw attachment body while preserving backpressure.
      proxy_request_buffering off;
      proxy_buffering off;
    }

    location / {
      set $upstream http://web:3000;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Preserve the loopback port in development; application code validates
      # this exact trusted Host rather than inferring URLs from it.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $http_x_real_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $original_scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_buffering off;
    }
  }
}

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: scripts/check-secrets.sh
      - run: scripts/tests/libpq-service.test.sh
      - run: scripts/tests/reconcile-clamav.test.sh
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker build --target runner -f apps/web/Dockerfile .
      - run: docker build --target runner -f apps/worker/Dockerfile .
      - run: docker build --target runner -f infra/docker/Dockerfile.migrate .
      - run: docker build -f infra/nginx/Dockerfile .
      - run: docker build -f infra/docker/Dockerfile.backup .
      - run: docker build -t itqanak-redis-production-test -f infra/docker/Dockerfile.redis .
      - run: scripts/tests/redis-production-container.test.sh itqanak-redis-production-test
      - run: docker build -f infra/docker/Dockerfile.clamav .
      - run: >-
          ITQANAK_DATABASE_URL_SECRET_FILE=/dev/null
          ITQANAK_REDIS_URL_SECRET_FILE=/dev/null
          ITQANAK_POSTGRES_PASSWORD_SECRET_FILE=/dev/null
          ITQANAK_REDIS_PASSWORD_SECRET_FILE=/dev/null
          ITQANAK_AUTH_EMAIL_PAYLOAD_KEY_SECRET_FILE=/dev/null
          ITQANAK_SMTP_PASSWORD_SECRET_FILE=/dev/null
          ITQANAK_STORAGE_S3_REGION=us-east-1
          ITQANAK_STORAGE_S3_BUCKET=itqanak-private-ci
          ITQANAK_STORAGE_S3_ACCESS_KEY_ID_SECRET_FILE=/dev/null
          ITQANAK_STORAGE_S3_SECRET_ACCESS_KEY_SECRET_FILE=/dev/null
          docker compose -f compose.production.yaml config --quiet

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: docker compose build migrate
      - run: docker compose up -d postgres redis
      - run: >-
          docker compose exec -T postgres
          createuser --username=itqanak --login --no-superuser --no-createdb
          --no-createrole --no-replication --no-bypassrls itqanak_runtime
      - run: docker compose exec -T postgres createdb --username=itqanak itqanak_ci_test
      - run: docker compose exec -T postgres createdb --username=itqanak itqanak_ci_upgrade_test
      - run: >-
          docker compose run --rm --no-deps
          -e TEST_DATABASE_URL=postgresql://itqanak@postgres:5432/itqanak_ci_test
          -e TEST_REDIS_URL=redis://redis:6379/15
          -e ITQANAK_INTEGRATION_DATABASE=isolated-test-database
          migrate /bin/sh -ec
          'pnpm turbo run build --filter=@itqanak/auth... --filter=@itqanak/catalog... --filter=@itqanak/requests... && pnpm test:integration'
      - run: >-
          docker compose run --rm --no-deps
          -e UPGRADE_TEST_DATABASE_URL=postgresql://itqanak@postgres:5432/itqanak_ci_upgrade_test
          migrate /bin/sh -ec
          'pnpm exec vitest run --config vitest.integration.config.ts
          packages/db/test/unified-conversation-upgrade.integration.test.ts'
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: docker compose ps
      - run: curl --fail --retry 20 --retry-connrefused http://127.0.0.1:8080/api/health/live
      - run: curl --fail --retry 20 --retry-connrefused http://127.0.0.1:8080/api/health/ready
      - if: always()
        run: docker compose down

  auth-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: itqanak-auth-e2e
      E2E_COMPOSE_PROJECT_NAME: itqanak-auth-e2e
      ITQANAK_GATEWAY_HOST_PORT: "18081"
      AUTH_E2E_BASE_URL: http://127.0.0.1:18081
      PUBLIC_APP_URL: http://127.0.0.1:18081
      ADMIN_APP_URL: http://127.0.0.1:18081
      AUTH_RATE_LIMIT_ENABLED: "false"
      EMAIL_DELIVERY_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run phone-first authentication flow in an isolated stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --build --wait --wait-timeout 300 web gateway
          pnpm test:auth-e2e
      - if: failure()
        run: docker compose ps --all
      - if: always()
        run: docker compose down

  requests-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: itqanak-requests-e2e
      E2E_COMPOSE_PROJECT_NAME: itqanak-requests-e2e
      ITQANAK_GATEWAY_HOST_PORT: "18082"
      REQUESTS_E2E_BASE_URL: http://127.0.0.1:18082
      PUBLIC_APP_URL: http://127.0.0.1:18082
      ADMIN_APP_URL: http://127.0.0.1:18082
      AUTH_RATE_LIMIT_ENABLED: "false"
      EMAIL_DELIVERY_MODE: disabled
      FILE_SCAN_MODE: disabled
      STORAGE_DRIVER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run service-request browser flow with development scan mode
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --build --wait --wait-timeout 300 web gateway
          docker compose run --rm --no-deps migrate /bin/sh -ec \
            'pnpm catalog:seed-development'
          curl --fail --retry 20 --retry-connrefused \
            http://127.0.0.1:8080/api/health/ready >/dev/null
          pnpm test:requests-e2e
      - if: failure()
        run: docker compose ps --all
      - if: always()
        run: docker compose down

  antivirus-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run clean and EICAR checks against the opt-in antivirus profile
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile antivirus build migrate
          docker compose --profile antivirus up -d --wait --wait-timeout 360 clamav postgres
          docker compose exec -T postgres createdb --username=itqanak itqanak_antivirus_test
          docker compose --profile antivirus run --rm --no-deps \
            -e TEST_CLAMAV_HOST=clamav \
            -e TEST_CLAMAV_PORT=3310 \
            -e TEST_DATABASE_URL=postgresql://itqanak@postgres:5432/itqanak_antivirus_test \
            -e ITQANAK_INTEGRATION_DATABASE=isolated-test-database \
            migrate /bin/sh -ec \
            'pnpm turbo run build --filter=@itqanak/requests... && \
             pnpm --filter @itqanak/storage exec vitest run src/clamav.integration.test.ts && \
             pnpm exec vitest run --config vitest.integration.config.ts \
               packages/requests/test/antivirus.integration.test.ts'
      - name: Verify the supervised ClamAV service recovers when clamd exits
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker compose --profile antivirus ps -q clamav)"
          test -n "$container_id"
          restart_count="$(docker inspect "$container_id" --format '{{.RestartCount}}')"
          docker compose --profile antivirus exec -T clamav \
            sh -ec 'kill "$(pidof clamd)"'
          for attempt in $(seq 1 180); do
            current_count="$(docker inspect "$container_id" --format '{{.RestartCount}}')"
            if test "$current_count" -gt "$restart_count" && \
              docker compose --profile antivirus exec -T clamav \
                clamdscan --ping 1 >/dev/null 2>&1; then
              docker logs "$container_id" 2>&1 | \
                grep -q 'clamav_runtime_failed: clamd exited'
              exit 0
            fi
            sleep 1
          done
          exit 1
      - if: failure()
        run: docker compose --profile antivirus ps --all
      - if: always()
        run: docker compose --profile antivirus down

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:smoke

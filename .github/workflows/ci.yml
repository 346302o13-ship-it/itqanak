name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: scripts/check-secrets.sh
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker build --target runner -f apps/web/Dockerfile .
      - run: docker build --target runner -f apps/worker/Dockerfile .
      - run: docker build --target runner -f infra/docker/Dockerfile.migrate .
      - run: docker build -f infra/nginx/Dockerfile .
      - run: docker build -f infra/docker/Dockerfile.backup .
      - run: >-
          ITQANAK_DATABASE_URL_SECRET_FILE=/dev/null
          ITQANAK_REDIS_URL_SECRET_FILE=/dev/null
          ITQANAK_POSTGRES_PASSWORD_SECRET_FILE=/dev/null
          ITQANAK_REDIS_PASSWORD_SECRET_FILE=/dev/null
          ITQANAK_VERIFY_DATABASE_URL_SECRET_FILE=/dev/null
          docker compose -f compose.production.yaml config --quiet

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: docker compose build migrate
      - run: docker compose up -d postgres redis
      - run: >-
          docker compose run --rm --no-deps
          -e TEST_DATABASE_URL=postgresql://itqanak@postgres:5432/itqanak
          migrate /bin/sh -ec
          'pnpm turbo run build --filter=@itqanak/db... && pnpm test:integration'
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: docker compose ps
      - run: curl --fail --retry 20 --retry-connrefused http://127.0.0.1:8080/api/health/live
      - run: curl --fail --retry 20 --retry-connrefused http://127.0.0.1:8080/api/health/ready
      - if: always()
        run: docker compose down

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:smoke

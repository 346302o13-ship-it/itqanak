name: itqanak

# Production topology. Set the *_SECRET_FILE variables to absolute paths that
# are owned by the deploy account, group-readable by the dedicated deployment
# secrets group, and mode 0440. Set ITQANAK_SECRETS_GID to that group's numeric
# GID (default 20000). Their contents are never put in this repository, the
# Compose model, or container environment variables.
x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

x-hardened-app: &hardened-app
  init: true
  group_add:
    - ${ITQANAK_SECRETS_GID:-20000}
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *default-logging

services:
  postgres:
    image: postgres:17.10-alpine
    # The image entrypoint supports initialization as the packaged postgres
    # user. This avoids relying on root, gosu, or ownership capabilities when
    # Docker creates a brand-new named volume.
    user: "postgres"
    group_add:
      - ${ITQANAK_SECRETS_GID:-20000}
    environment:
      POSTGRES_DB: itqanak
      POSTGRES_USER: itqanak
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=70,gid=70,mode=0700
      - /run/postgresql:rw,noexec,nosuid,size=16m,uid=70,gid=70,mode=3775
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=itqanak --dbname=itqanak"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
          pids: 128
    logging: *default-logging

  redis:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.redis
    user: "redis"
    group_add:
      - ${ITQANAK_SECRETS_GID:-20000}
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    networks:
      - backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/itqanak-redis-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 128
    logging: *default-logging

  # Private S3-compatible object storage for request attachments. It is
  # reachable only on the internal backend network and has no published port.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    user: "1000:20000"
    group_add:
      - ${ITQANAK_SECRETS_GID:-20000}
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER_FILE: /run/secrets/storage_s3_root_access_key_id
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/storage_s3_root_secret_access_key
    command: ["server", "/data"]
    secrets:
      - storage_s3_root_access_key_id
      - storage_s3_root_secret_access_key
    volumes:
      - object-storage-data:/data
    networks:
      - backend
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
          pids: 128
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    user: "1000:20000"
    group_add:
      - ${ITQANAK_SECRETS_GID:-20000}
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER_FILE: /run/secrets/storage_s3_root_access_key_id
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/storage_s3_root_secret_access_key
      MINIO_APP_USER_FILE: /run/secrets/storage_s3_access_key_id
      MINIO_APP_PASSWORD_FILE: /run/secrets/storage_s3_secret_access_key
      MINIO_BUCKET: ${ITQANAK_STORAGE_S3_BUCKET:?Set ITQANAK_STORAGE_S3_BUCKET}
    entrypoint: ["/bin/sh", "/usr/local/bin/itqanak-minio-init"]
    secrets:
      - storage_s3_root_access_key_id
      - storage_s3_root_secret_access_key
      - storage_s3_access_key_id
      - storage_s3_secret_access_key
    configs:
      - source: minio_init
        target: /usr/local/bin/itqanak-minio-init
        mode: 0555
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  clamav:
    # Opt-in capability. The host reconciler starts this exact service only
    # after the administrator enables scanning; ordinary production startup
    # does not allocate ClamAV memory.
    profiles: ["antivirus"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.clamav
    user: "clamav"
    init: true
    volumes:
      - clamav-data:/var/lib/clamav
    networks:
      - backend
      - egress
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /var/log/clamav:rw,noexec,nosuid,size=32m,uid=100,gid=101,mode=0750
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          # Concurrent database reloads are disabled by the supervised
          # entrypoint, keeping one signature image resident at a time.
          memory: 2G
          pids: 256
    logging: *default-logging

  # A forward-only migration job gates application startup. It deliberately
  # retains no volume and cannot be restarted as a long-running service.
  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.migrate
      target: runner
    environment:
      NODE_ENV: production
      APP_ENV: production
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://itqanqhelpstudent.online}
      ADMIN_APP_URL: ${ADMIN_APP_URL:-https://admin.itqanqhelpstudent.online}
      ACADEMIC_INTEGRITY_VERSION: ${ACADEMIC_INTEGRITY_VERSION:-2026-08}
      MIGRATIONS_DIR: /workspace/migrations
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
    secrets:
      - database_url
      - redis_url
    group_add:
      - ${ITQANAK_SECRETS_GID:-20000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          pids: 128
    logging: *default-logging

  web:
    <<: *hardened-app
    # Keep the application root immutable while giving Next's image optimizer
    # a bounded, non-executable cache owned by the unprivileged runtime user.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1001,gid=1001,mode=0700
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=64m,uid=1001,gid=1001,mode=0700
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    environment:
      NODE_ENV: production
      APP_ENV: production
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://itqanqhelpstudent.online}
      ADMIN_APP_URL: ${ADMIN_APP_URL:-https://admin.itqanqhelpstudent.online}
      CLOUDFLARE_ACCESS_MODE: ${CLOUDFLARE_ACCESS_MODE:-disabled}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}
      CLOUDFLARE_ACCESS_AUDIENCE: ${CLOUDFLARE_ACCESS_AUDIENCE:-}
      CLOUDFLARE_ACCESS_ADMIN_EMAIL: ${CLOUDFLARE_ACCESS_ADMIN_EMAIL:-}
      ACADEMIC_INTEGRITY_VERSION: ${ACADEMIC_INTEGRITY_VERSION:-2026-08}
      MIGRATIONS_DIR: /app/migrations
      VERIFY_SCHEMA_ON_STARTUP: "true"
      DATABASE_URL_FILE: /run/secrets/runtime_database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      AUTH_STUDENT_SESSION_ABSOLUTE_TTL_SECONDS: ${AUTH_STUDENT_SESSION_ABSOLUTE_TTL_SECONDS:-2592000}
      AUTH_STUDENT_SESSION_IDLE_TTL_SECONDS: ${AUTH_STUDENT_SESSION_IDLE_TTL_SECONDS:-604800}
      AUTH_ADMIN_SESSION_ABSOLUTE_TTL_SECONDS: ${AUTH_ADMIN_SESSION_ABSOLUTE_TTL_SECONDS:-43200}
      AUTH_ADMIN_SESSION_IDLE_TTL_SECONDS: ${AUTH_ADMIN_SESSION_IDLE_TTL_SECONDS:-7200}
      AUTH_EMAIL_VERIFICATION_TTL_SECONDS: ${AUTH_EMAIL_VERIFICATION_TTL_SECONDS:-86400}
      AUTH_PASSWORD_RESET_TTL_SECONDS: ${AUTH_PASSWORD_RESET_TTL_SECONDS:-1800}
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
      TERMS_VERSION: ${TERMS_VERSION:-2026-08}
      PRIVACY_VERSION: ${PRIVACY_VERSION:-2026-08}
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-disabled}
      # Web Push: only the public key + subject reach the Web service (used by
      # /api/push/vapid-key). The private key is mounted in the Worker only.
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      # Ad pixels: unset by default, so no third-party script loads and the
      # strict CSP in next.config.ts is unchanged. Set to turn a campaign on.
      FB_PIXEL_ID: ${FB_PIXEL_ID:-}
      TIKTOK_PIXEL_ID: ${TIKTOK_PIXEL_ID:-}
      # AI assistant: a pool of Gemini API keys (each optional — an unset slot
      # mounts /dev/null, which resolveSecret treats as absent) rotated
      # automatically on quota/rate-limit errors. Zero keys just disables the
      # feature, no startup requirement.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_API_KEY_1_FILE: /run/secrets/gemini_api_key_1
      GEMINI_API_KEY_2_FILE: /run/secrets/gemini_api_key_2
      GEMINI_API_KEY_3_FILE: /run/secrets/gemini_api_key_3
      GEMINI_API_KEY_4_FILE: /run/secrets/gemini_api_key_4
      GEMINI_API_KEY_5_FILE: /run/secrets/gemini_api_key_5
      GEMINI_API_KEY_6_FILE: /run/secrets/gemini_api_key_6
      GEMINI_API_KEY_7_FILE: /run/secrets/gemini_api_key_7
      GEMINI_API_KEY_8_FILE: /run/secrets/gemini_api_key_8
      GEMINI_API_KEY_9_FILE: /run/secrets/gemini_api_key_9
      # Non-secret delivery descriptors for the administrator monitoring page.
      # The Meta token remains mounted only in the Worker service.
      WHATSAPP_MONITORING_MODE: ${WHATSAPP_MODE:-disabled}
      WHATSAPP_MONITORING_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_MONITORING_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
      WHATSAPP_MONITORING_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-ar}
      WHATSAPP_MONITORING_SUPPORT_RECIPIENT_E164: ${WHATSAPP_SUPPORT_RECIPIENT_E164:-+966564202263}
      WHATSAPP_MONITORING_NOTIFICATIONS_NOT_BEFORE: ${WHATSAPP_NOTIFICATIONS_NOT_BEFORE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ITQANAK}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      STORAGE_DRIVER: s3
      STORAGE_S3_ENDPOINT: ${ITQANAK_STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${ITQANAK_STORAGE_S3_REGION:?Set ITQANAK_STORAGE_S3_REGION}
      STORAGE_S3_BUCKET: ${ITQANAK_STORAGE_S3_BUCKET:?Set ITQANAK_STORAGE_S3_BUCKET}
      STORAGE_S3_FORCE_PATH_STYLE: ${ITQANAK_STORAGE_S3_FORCE_PATH_STYLE:-false}
      STORAGE_S3_ACCESS_KEY_ID_FILE: /run/secrets/storage_s3_access_key_id
      STORAGE_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/storage_s3_secret_access_key
      UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:-20971520}
      UPLOAD_MAX_FILES_PER_REQUEST: ${UPLOAD_MAX_FILES_PER_REQUEST:-10}
      UPLOAD_MAX_TOTAL_BYTES_PER_REQUEST: ${UPLOAD_MAX_TOTAL_BYTES_PER_REQUEST:-104857600}
      FILE_SCAN_MODE: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_CONNECT_TIMEOUT_MS: ${CLAMAV_CONNECT_TIMEOUT_MS:-3000}
      CLAMAV_SCAN_TIMEOUT_MS: ${CLAMAV_SCAN_TIMEOUT_MS:-30000}
      FILE_SCAN_MAX_ATTEMPTS: ${FILE_SCAN_MAX_ATTEMPTS:-5}
      OPERATIONAL_STATE_CACHE_TTL_MS: ${OPERATIONAL_STATE_CACHE_TTL_MS:-2000}
    secrets:
      - runtime_database_url
      - redis_url
      - auth_email_payload_key
      - smtp_password
      - storage_s3_access_key_id
      - storage_s3_secret_access_key
      - gemini_api_key_1
      - gemini_api_key_2
      - gemini_api_key_3
      - gemini_api_key_4
      - gemini_api_key_5
      - gemini_api_key_6
      - gemini_api_key_7
      - gemini_api_key_8
      - gemini_api_key_9
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - backend
      - egress
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      # /startup fails when Postgres or Redis is unreachable (unlike /live, which
      # is unconditionally 200), so a web app that is up but cannot serve is
      # reported unhealthy. Generous retries + start_period ride out a boot or a
      # brief dependency blip.
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/health/startup'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
          pids: 256

  worker:
    <<: *hardened-app
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: runner
    environment:
      NODE_ENV: production
      APP_ENV: production
      PUBLIC_APP_URL: https://itqanqhelpstudent.online
      ADMIN_APP_URL: https://admin.itqanqhelpstudent.online
      ACADEMIC_INTEGRITY_VERSION: ${ACADEMIC_INTEGRITY_VERSION:-2026-08}
      MIGRATIONS_DIR: /app/migrations
      DATABASE_URL_FILE: /run/secrets/runtime_database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      WORKER_HEARTBEAT_FILE: /tmp/itqanak-worker-heartbeat
      AUTH_STUDENT_SESSION_ABSOLUTE_TTL_SECONDS: ${AUTH_STUDENT_SESSION_ABSOLUTE_TTL_SECONDS:-2592000}
      AUTH_STUDENT_SESSION_IDLE_TTL_SECONDS: ${AUTH_STUDENT_SESSION_IDLE_TTL_SECONDS:-604800}
      AUTH_ADMIN_SESSION_ABSOLUTE_TTL_SECONDS: ${AUTH_ADMIN_SESSION_ABSOLUTE_TTL_SECONDS:-43200}
      AUTH_ADMIN_SESSION_IDLE_TTL_SECONDS: ${AUTH_ADMIN_SESSION_IDLE_TTL_SECONDS:-7200}
      AUTH_EMAIL_VERIFICATION_TTL_SECONDS: ${AUTH_EMAIL_VERIFICATION_TTL_SECONDS:-86400}
      AUTH_PASSWORD_RESET_TTL_SECONDS: ${AUTH_PASSWORD_RESET_TTL_SECONDS:-1800}
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
      TERMS_VERSION: ${TERMS_VERSION:-2026-08}
      PRIVACY_VERSION: ${PRIVACY_VERSION:-2026-08}
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-disabled}
      WHATSAPP_MODE: ${WHATSAPP_MODE:-disabled}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-ar}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v25.0}
      WHATSAPP_SUPPORT_RECIPIENT_E164: ${WHATSAPP_SUPPORT_RECIPIENT_E164:-+966564202263}
      WHATSAPP_MAX_ATTEMPTS: ${WHATSAPP_MAX_ATTEMPTS:-8}
      WHATSAPP_NOTIFICATIONS_NOT_BEFORE: ${WHATSAPP_NOTIFICATIONS_NOT_BEFORE:-}
      WHATSAPP_ACCESS_TOKEN_FILE: /run/secrets/whatsapp_access_token
      # Web Push (Worker sends the encrypted notifications). Feature is off
      # until all three are set.
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ITQANAK}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      STORAGE_DRIVER: s3
      STORAGE_S3_ENDPOINT: ${ITQANAK_STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${ITQANAK_STORAGE_S3_REGION:?Set ITQANAK_STORAGE_S3_REGION}
      STORAGE_S3_BUCKET: ${ITQANAK_STORAGE_S3_BUCKET:?Set ITQANAK_STORAGE_S3_BUCKET}
      STORAGE_S3_FORCE_PATH_STYLE: ${ITQANAK_STORAGE_S3_FORCE_PATH_STYLE:-false}
      STORAGE_S3_ACCESS_KEY_ID_FILE: /run/secrets/storage_s3_access_key_id
      STORAGE_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/storage_s3_secret_access_key
      UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:-20971520}
      UPLOAD_MAX_FILES_PER_REQUEST: ${UPLOAD_MAX_FILES_PER_REQUEST:-10}
      UPLOAD_MAX_TOTAL_BYTES_PER_REQUEST: ${UPLOAD_MAX_TOTAL_BYTES_PER_REQUEST:-104857600}
      FILE_SCAN_MODE: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_CONNECT_TIMEOUT_MS: ${CLAMAV_CONNECT_TIMEOUT_MS:-3000}
      CLAMAV_SCAN_TIMEOUT_MS: ${CLAMAV_SCAN_TIMEOUT_MS:-30000}
      FILE_SCAN_MAX_ATTEMPTS: ${FILE_SCAN_MAX_ATTEMPTS:-5}
      OPERATIONAL_STATE_CACHE_TTL_MS: ${OPERATIONAL_STATE_CACHE_TTL_MS:-2000}
    secrets:
      - runtime_database_url
      - redis_url
      - auth_email_payload_key
      - smtp_password
      - whatsapp_access_token
      - storage_s3_access_key_id
      - storage_s3_secret_access_key
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - backend
      - egress
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const fs = require(''node:fs''); try { const age = Date.now() - fs.statSync(''/tmp/itqanak-worker-heartbeat'').mtimeMs; process.exit(age < 45000 ? 0 : 1); } catch { process.exit(1); }"',
        ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
          pids: 256

  gateway:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - backend
      - frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=0700
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=0750
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/_gateway/health"]
      interval: 15s
      timeout: 4s
      retries: 8
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 128
    logging: *default-logging

  # Invoked explicitly by systemd or an operator:
  # docker compose -f compose.production.yaml --profile operations run --rm backup
  backup:
    profiles: ["operations"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backup
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      VERIFY_DATABASE_NAME: itqanak_restore_verification
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "30"
    secrets:
      - database_url
    group_add:
      - ${ITQANAK_SECRETS_GID:-20000}
    volumes:
      # This is runtime backup data, not application code. Keep it mode 0700
      # and excluded from Git; set ITQANAK_BACKUP_DIR to an absolute host path.
      - ${ITQANAK_BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - egress
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          pids: 128
    logging: *default-logging

networks:
  backend:
    internal: true
  # Web/worker have outbound access for future approved integrations. No service
  # on this network publishes a host port.
  egress:
  # This is deliberately gateway-only: it permits Docker to publish the
  # loopback-bound port without exposing backend services.
  frontend:

volumes:
  postgres-data:
  redis-data:
  clamav-data:
  object-storage-data:

configs:
  minio_init:
    file: ./infra/minio/initialize.sh

secrets:
  database_url:
    file: ${ITQANAK_DATABASE_URL_SECRET_FILE:?Set ITQANAK_DATABASE_URL_SECRET_FILE to a protected secret-file path}
  runtime_database_url:
    file: ${ITQANAK_RUNTIME_DATABASE_URL_SECRET_FILE:?Set ITQANAK_RUNTIME_DATABASE_URL_SECRET_FILE to a protected secret-file path}
  redis_url:
    file: ${ITQANAK_REDIS_URL_SECRET_FILE:?Set ITQANAK_REDIS_URL_SECRET_FILE to a protected secret-file path}
  postgres_password:
    file: ${ITQANAK_POSTGRES_PASSWORD_SECRET_FILE:?Set ITQANAK_POSTGRES_PASSWORD_SECRET_FILE to a protected secret-file path}
  redis_password:
    file: ${ITQANAK_REDIS_PASSWORD_SECRET_FILE:?Set ITQANAK_REDIS_PASSWORD_SECRET_FILE to a protected secret-file path}
  # Optional until SMTP delivery is enabled. The auth configuration rejects an
  # empty mounted key only when an auth email flow is configured to deliver.
  auth_email_payload_key:
    file: ${ITQANAK_AUTH_EMAIL_PAYLOAD_KEY_SECRET_FILE:-/dev/null}
  smtp_password:
    file: ${ITQANAK_SMTP_PASSWORD_SECRET_FILE:-/dev/null}
  whatsapp_access_token:
    file: ${ITQANAK_WHATSAPP_ACCESS_TOKEN_SECRET_FILE:-/dev/null}
  # AI assistant: each slot optional, defaults to /dev/null (treated as
  # unconfigured — see resolveSecret's allowEmpty). Zero keys just disables
  # the assistant feature.
  gemini_api_key_1:
    file: ${ITQANAK_GEMINI_API_KEY_1_SECRET_FILE:-/dev/null}
  gemini_api_key_2:
    file: ${ITQANAK_GEMINI_API_KEY_2_SECRET_FILE:-/dev/null}
  gemini_api_key_3:
    file: ${ITQANAK_GEMINI_API_KEY_3_SECRET_FILE:-/dev/null}
  gemini_api_key_4:
    file: ${ITQANAK_GEMINI_API_KEY_4_SECRET_FILE:-/dev/null}
  gemini_api_key_5:
    file: ${ITQANAK_GEMINI_API_KEY_5_SECRET_FILE:-/dev/null}
  gemini_api_key_6:
    file: ${ITQANAK_GEMINI_API_KEY_6_SECRET_FILE:-/dev/null}
  gemini_api_key_7:
    file: ${ITQANAK_GEMINI_API_KEY_7_SECRET_FILE:-/dev/null}
  gemini_api_key_8:
    file: ${ITQANAK_GEMINI_API_KEY_8_SECRET_FILE:-/dev/null}
  gemini_api_key_9:
    file: ${ITQANAK_GEMINI_API_KEY_9_SECRET_FILE:-/dev/null}
  storage_s3_access_key_id:
    file: ${ITQANAK_STORAGE_S3_ACCESS_KEY_ID_SECRET_FILE:?Set ITQANAK_STORAGE_S3_ACCESS_KEY_ID_SECRET_FILE to a protected secret-file path}
  storage_s3_secret_access_key:
    file: ${ITQANAK_STORAGE_S3_SECRET_ACCESS_KEY_SECRET_FILE:?Set ITQANAK_STORAGE_S3_SECRET_ACCESS_KEY_SECRET_FILE to a protected secret-file path}
  storage_s3_root_access_key_id:
    file: ${ITQANAK_STORAGE_S3_ROOT_ACCESS_KEY_ID_SECRET_FILE:?Set ITQANAK_STORAGE_S3_ROOT_ACCESS_KEY_ID_SECRET_FILE to a protected secret-file path}
  storage_s3_root_secret_access_key:
    file: ${ITQANAK_STORAGE_S3_ROOT_SECRET_ACCESS_KEY_SECRET_FILE:?Set ITQANAK_STORAGE_S3_ROOT_SECRET_ACCESS_KEY_SECRET_FILE to a protected secret-file path}
